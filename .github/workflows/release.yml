name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    # Python 3.8 (the oldest we support) is not published for newer Ubuntu images.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Shared library copies are in sync
        run: python tools/sync_shared.py --check
      - name: marketplace.json matches SKILL.md versions
        run: python tools/gen_marketplace.py --check
      - name: Run all test suites on the oldest supported Python
        run: python tools/run_tests.py -v
      - name: Build one zip per skill (template excluded, UTF-8 name flag set)
        run: python tools/build_free.py --out dist --suffix "$GITHUB_REF_NAME"
      - name: Extract release notes for this tag
        run: |
          python - <<'PY'
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              lines = fh.read().splitlines()
          out, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line.startswith("## %s " % tag) or line.strip() == "## " + tag
                  continue
              if inside:
                  out.append(line)
          notes = "\n".join(out).strip()
          if not notes:
              print("No CHANGELOG section for %s, using the whole file" % tag)
              notes = "\n".join(lines).strip()
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(notes + "\n")
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
